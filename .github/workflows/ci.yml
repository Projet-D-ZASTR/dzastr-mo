name: CI

on:
  push:
    branches: [develop, production, test-syntaxe]
  pull_request:
    branches: [develop, production, test-syntaxe]

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/ruff-action@v3
        with:
          args: "check ."

      - uses: astral-sh/ruff-action@v3
        with:
          args: "format --check ."

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest ruff

      - name: Run tests
        run: pytest test/
        env:
          DATABASE_URL: sqlite:///:memory:
          AUTH_SERVICE_TOKEN: ci-test-token
          SERVICE_TOKEN: ci-test-token
