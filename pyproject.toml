[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["test"]
norecursedirs = ["Load", ".venv", "__pycache__"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["config", "src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (géré par le formatter)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
